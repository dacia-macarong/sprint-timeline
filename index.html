<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플랫폼혁신팀 스프린트 타임라인 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 32px 36px 48px;
      min-height: 100vh;
    }
    .page-header { margin-bottom: 28px; }
    h1 { font-size: 20px; font-weight: 700; color: #f0f6fc; margin-bottom: 5px; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: #6e7681; }
    .subtitle a { color: #58a6ff; text-decoration: none; }
    .subtitle a:hover { text-decoration: underline; }
    .legend { display: flex; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #8b949e; }
    .legend-chip { width: 24px; height: 10px; border-radius: 5px; }
    #chart-wrapper { overflow-x: auto; padding-bottom: 8px; }
    canvas { display: block; }
    #tooltip {
      position: fixed;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      display: none;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      min-width: 220px;
    }
    .tt-title { font-size: 13px; font-weight: 600; color: #f0f6fc; margin-bottom: 10px; }
    .tt-row { display: flex; justify-content: space-between; gap: 24px; padding: 1.5px 0; }
    .tt-label { color: #6e7681; white-space: nowrap; }
    .tt-val { color: #e6edf3; font-weight: 500; }
    .tt-divider { border: none; border-top: 1px solid #21262d; margin: 8px 0; }
    .tt-leadtime { color: #58a6ff !important; font-weight: 600 !important; }
    .tt-inprogress { color: #3fb950 !important; }
    #loading {
      display: flex; align-items: center; gap: 12px;
      color: #6e7681; font-size: 14px; padding: 40px 0;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      background: #1f1015;
      border: 1px solid #6e2a3a;
      border-radius: 8px;
      padding: 16px 20px;
      color: #f85149;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>플랫폼혁신팀 스프린트 타임라인 2026</h1>
    <div class="subtitle">
      <a href="https://docs.google.com/spreadsheets/d/1XTE_X-NEkVE6A2FrCDmbUg9qjNsbOXO1WUGUZ16wN1k" target="_blank">Google Sheets</a>
      에서 15분마다 자동 동기화 · 행 클릭 시 Asana 이동 · <span id="updated-at"></span>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-chip" style="background:#475569"></div>기획</div>
    <div class="legend-item"><div class="legend-chip" style="background:#7c3aed"></div>디자인</div>
    <div class="legend-item"><div class="legend-chip" style="background:#ea580c"></div>개발</div>
    <div class="legend-item"><div class="legend-chip" style="background:#16a34a"></div>QA</div>
    <div class="legend-item"><div class="legend-chip" style="background:#0891b2"></div>배포</div>
    <div class="legend-item"><div style="width:8px;height:8px;border-radius:50%;background:#c4b5fd;border:1.5px solid #0d1117;flex-shrink:0"></div>시안</div>
    <div class="legend-item"><div style="width:9px;height:9px;border-radius:50%;background:#7c3aed;border:1.5px solid #0d1117;flex-shrink:0"></div>가이드</div>
  </div>

  <div id="loading"><div class="spinner"></div>데이터 불러오는 중...</div>
  <div id="error"></div>
  <div id="chart-wrapper" style="display:none">
    <canvas id="chart"></canvas>
  </div>
  <div id="tooltip"></div>

<script>
// ── 데이터 소스 ───────────────────────────────────────────────
// GitHub Actions가 15분마다 구글 시트를 읽어 data.json으로 저장
const DATA_URL = './data.json';

// ── 색상/단계 ─────────────────────────────────────────────────
const PHASES = {
  planning: { color: '#475569', label: '기획' },
  design:   { color: '#7c3aed', label: '디자인' },
  dev:      { color: '#ea580c', label: '개발' },
  qa:       { color: '#16a34a', label: 'QA' },
  release:  { color: '#0891b2', label: '배포' },
};

// ── 수동 조정 ─────────────────────────────────────────────────
// 스프레드시트에 담기 어려운 예외 처리 (날짜 보정)
// 형식: { '태스크명': [{ phase, days, note }] }
// phase: 'planning' | 'design' | 'dev' | 'qa' | 'release'
// days: 양수(추가) 또는 음수(차감)
const ADJUSTMENTS = {
  '영수증 촬영': [
    { phase: 'dev', days: -1, note: '개발 중 타 태스크 우선 처리로 1일 중단' },
  ],
};

// ── CSV 파싱 ──────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQ = false;
      else field += ch;
    } else {
      if      (ch === '"')  inQ = true;
      else if (ch === ',')  { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') {}
      else field += ch;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseTasks(csvText) {
  const rows = parseCSV(csvText);
  // 헤더 행 찾기 (첫 컬럼 = "태스크")
  const hi = rows.findIndex(r => r[0]?.trim() === '태스크');
  if (hi === -1) throw new Error('헤더 행을 찾을 수 없습니다');
  const tasks = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0]?.trim()) continue; // 빈 행 스킵
    tasks.push({
      name:         r[0]?.trim() || '',
      owner:        r[1]?.trim() || '',
      created:      r[2]?.trim() || '',
      planning:     r[3]?.trim() || '',
      design_draft: r[4]?.trim() || '',
      dev_review:   r[5]?.trim() || '',
      guide:        r[6]?.trim() || '',
      dev_complete: r[7]?.trim() || '',
      qa_complete:  r[8]?.trim() || '',
      done:         r[9]?.trim() || '',
      link:         r[10]?.trim() || '',
    });
  }
  return tasks;
}

// ── 날짜 유틸 ────────────────────────────────────────────────
function parseDate(s) {
  if (!s || !s.trim()) return null;
  const p = s.replace(/\./g, ' ').trim().split(/\s+/).filter(Boolean);
  if (p.length < 3) return null;
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function fmtDate(d) {
  if (!d) return '-';
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// ── 단계 계산 ─────────────────────────────────────────────────
// 기획:  생성일 → 기획서 작성일
// 디자인: 기획서 작성일 → 가이드 완료 (기획서 없으면 시안완료를 시작점으로)
// 개발:  개발검토 → 개발 완료
// QA:   개발 완료 → devQA 완료
// 배포:  devQA 완료 → 태스크 완료
function getSegments(task) {
  const c  = parseDate(task.created);
  const pl = parseDate(task.planning);     // 기획서 작성
  const dd = parseDate(task.design_draft); // 시안완료 (마일스톤 마커)
  const dr = parseDate(task.dev_review);   // 개발검토
  const g  = parseDate(task.guide);        // 가이드 완료
  const dc = parseDate(task.dev_complete);
  const qa = parseDate(task.qa_complete);
  const dn = parseDate(task.done);
  const dates = { created:c, planning:pl, design_draft:dd, dev_review:dr,
                  guide:g, dev_complete:dc, qa_complete:qa, done:dn };

  if (!c) return { segments: [], dates };

  const segs = [];
  const endOfChart = new Date(2026, 5, 15);

  // ── 기획: 생성일 → 기획서 작성일 ───────────────────────────
  if (pl && pl > c) segs.push({ start: c, end: pl, phase: 'planning' });

  // ── 디자인: 기획서 작성일 → 가이드 완료 ─────────────────────
  // (기획서 없으면 시안완료를 시작점으로 사용)
  const designStart = pl || dd;
  if (designStart && g && g > designStart) {
    segs.push({ start: designStart, end: g, phase: 'design' });
  }

  // ── 개발: 개발검토 → 개발 완료 ──────────────────────────────
  if (dr && dc && dc > dr) segs.push({ start: dr, end: dc, phase: 'dev' });

  // ── QA: 개발 완료 → devQA 완료 ──────────────────────────────
  if (dc) {
    const qaEnd = qa || (dn && dn > dc ? dn : null);
    if (qaEnd && qaEnd > dc) segs.push({ start: dc, end: qaEnd, phase: 'qa' });
  }

  // ── 배포: devQA 완료 → 태스크 완료 ──────────────────────────
  if (qa && dn && dn > qa) segs.push({ start: qa, end: dn, phase: 'release' });

  // ── 기획 폴백: 기획서 없는 태스크에서 첫 bar 이전 기간을 기획으로 채움
  if (!pl && segs.length > 0) {
    segs.sort((a, b) => a.start - b.start);
    const firstStart = segs[0].start;
    if (firstStart > c) segs.unshift({ start: c, end: firstStart, phase: 'planning' });
  }

  // ── 순수 폴백: 마일스톤이 전혀 없는 태스크
  if (segs.length === 0) segs.push({ start: c, end: dn || endOfChart, phase: 'planning' });

  segs.sort((a, b) => a.start - b.start);
  return { segments: segs, dates };
}

// ── 실 작업 일수 계산 (겹치는 구간 병합 + 수동 조정 반영) ────
function calcActiveDays(segs, taskName) {
  if (!segs.length) return 0;
  const sorted = [...segs].sort((a, b) => a.start - b.start);
  const merged = [{ start: sorted[0].start, end: sorted[0].end }];
  for (let i = 1; i < sorted.length; i++) {
    const last = merged[merged.length - 1];
    if (sorted[i].start <= last.end) {
      if (sorted[i].end > last.end) last.end = sorted[i].end;
    } else {
      merged.push({ start: sorted[i].start, end: sorted[i].end });
    }
  }
  let total = merged.reduce((sum, s) => sum + Math.round((s.end - s.start) / 86400000), 0);

  // 수동 조정 적용
  const adjs = taskName ? (ADJUSTMENTS[taskName] || []) : [];
  adjs.forEach(a => { total += a.days; });

  return Math.max(0, total);
}

// ── 렌더링 ────────────────────────────────────────────────────
const LABEL_W  = 188;
const ROW_H    = 42;
const BAR_H    = 20;
const HEADER_H = 54;
const PPD      = 7.8;  // 픽셀/일
const PAD_R    = 32;
const CHART_START = new Date(2026, 1, 1);   // 2월 1일
const CHART_END   = new Date(2026, 5, 1);   // 6월 1일 (5월 말까지)
const TOTAL_DAYS  = (CHART_END - CHART_START) / 86400000;

function dateToX(d) {
  return LABEL_W + (d - CHART_START) / 86400000 * PPD;
}

function renderChart(rawTasks) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('chart-wrapper').style.display = 'block';

  const canvas = document.getElementById('chart');
  canvas.width  = LABEL_W + Math.ceil(TOTAL_DAYS * PPD) + PAD_R;
  canvas.height = HEADER_H + rawTasks.length * ROW_H + 12;
  const ctx = canvas.getContext('2d');

  function roundRect(x, y, w, h, r) {
    if (w < 1) w = 1;
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  // 배경
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 월 컬럼 + 주/일 격자
  const monthNames = ['1월','2월','3월','4월','5월','6월'];
  for (let m = 2; m <= 5; m++) {
    const d  = new Date(2026, m-1, 1);
    const x  = dateToX(d);
    const nx = dateToX(new Date(2026, m, 1));

    // 짝수 월 배경 음영
    if (m % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.018)';
      ctx.fillRect(x, HEADER_H, nx - x, canvas.height - HEADER_H);
    }

    // 월 이름 (굵게, 상단)
    ctx.fillStyle = '#58a6ff';
    ctx.font = '700 12px -apple-system, sans-serif';
    ctx.fillText(monthNames[m-1], x + 5, 18);

    // 주 단위 격자선 + 날짜 레이블
    const dim = new Date(2026, m, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      const dd = new Date(2026, m-1, day);
      if (dd >= CHART_END) break;
      const wx = dateToX(dd);
      const dow = dd.getDay(); // 0=일, 6=토

      if (day === 1) continue; // 월 경계는 별도 처리

      if (dow === 1) {
        // 월요일 = 주 시작: 격자선 + 날짜 레이블
        ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(wx, HEADER_H - 8); ctx.lineTo(wx, canvas.height); ctx.stroke();
        ctx.fillStyle = '#484f58';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillText(`${day}`, wx + 2, 34);
      } else if (dow === 6 || dow === 0) {
        // 주말: 아주 연한 배경
        const nextX = wx + PPD;
        ctx.fillStyle = 'rgba(255,255,255,0.008)';
        ctx.fillRect(wx, HEADER_H, PPD, canvas.height - HEADER_H);
      }
    }
  }
  for (let m = 2; m <= 5; m++) {
    const x = dateToX(new Date(2026, m-1, 1));
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HEADER_H); ctx.lineTo(canvas.width, HEADER_H); ctx.stroke();

  // 레이블 영역
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, LABEL_W, canvas.height);
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(LABEL_W,0); ctx.lineTo(LABEL_W, canvas.height); ctx.stroke();
  ctx.fillStyle = '#6e7681';
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.fillText('태스크', 12, 22);

  // 태스크 렌더링
  const taskMeta = [];
  const ownerColors = { Dacia:'#1f4e8c', Ken:'#1a4731', Mike:'#4a1942',
                        Harry:'#5c2e00', Shunie:'#1e3a4a' };

  rawTasks.forEach((task, i) => {
    const { segments, dates } = getSegments(task);
    const inProgress = !dates.done;
    const y      = HEADER_H + i * ROW_H;
    const rowMid = y + ROW_H / 2;
    const barY   = rowMid - BAR_H / 2;

    ctx.fillStyle = i % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.015)';
    ctx.fillRect(0, y, canvas.width, ROW_H);
    ctx.strokeStyle = '#161b22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y+ROW_H); ctx.lineTo(canvas.width, y+ROW_H); ctx.stroke();

    // 태스크명
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = inProgress ? '#8b949e' : '#c9d1d9';
    let name = task.name;
    while (ctx.measureText(name + '…').width > LABEL_W - 16 && name.length > 2) name = name.slice(0,-1);
    if (name !== task.name) name += '…';
    ctx.fillText(name, 12, rowMid + 4.5);

    // 담당자 색 점
    const ownerColor = ownerColors[task.owner.split(',')[0].trim()] || '#1c2128';
    ctx.fillStyle = ownerColor;
    roundRect(12, rowMid+9, 5, 5, 2); ctx.fill();

    // 기준선
    if (dates.created) {
      const ed = dates.done || CHART_END;
      const x1 = dateToX(dates.created);
      const x2 = Math.min(dateToX(ed), canvas.width - PAD_R);
      ctx.fillStyle = '#21262d';
      roundRect(x1, rowMid-2, Math.max(x2-x1,4), 4, 2); ctx.fill();
    }

    // 단계 bar
    segments.forEach(seg => {
      const x1 = dateToX(seg.start);
      const x2 = Math.min(dateToX(seg.end), canvas.width - PAD_R);
      const w = Math.max(x2-x1, 3);
      const base = PHASES[seg.phase].color;
      ctx.fillStyle = inProgress ? base + 'aa' : base;
      roundRect(x1, barY, w, BAR_H, 4); ctx.fill();
      // 하이라이트
      const grad = ctx.createLinearGradient(x1, barY, x1, barY+BAR_H);
      grad.addColorStop(0, 'rgba(255,255,255,0.08)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      roundRect(x1, barY, w, BAR_H, 4); ctx.fill();
    });

    // 진행중 점선 화살표
    if (inProgress && dates.created) {
      const lastD = [dates.dev_complete, dates.guide, dates.dev_review, dates.design_draft, dates.planning]
      .filter(d => d && d >= dates.created)[0] || dates.created;
      const x = Math.min(dateToX(lastD), canvas.width - PAD_R - 40);
      ctx.strokeStyle = '#3fb95088'; ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(x, rowMid); ctx.lineTo(x+48, rowMid); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#3fb95088';
      ctx.beginPath(); ctx.moveTo(x+52, rowMid); ctx.lineTo(x+45, rowMid-5); ctx.lineTo(x+45, rowMid+5); ctx.closePath(); ctx.fill();
    }

    // 마일스톤 점
    const milestones = [
      { d: dates.design_draft, label: '시안',   color: '#c4b5fd', r: 4   },
      { d: dates.dev_review,   label: null,     color: '#d1d5db', r: 3   },
      { d: dates.guide,        label: '가이드', color: '#7c3aed', r: 4.5 },
      { d: dates.dev_complete, label: null,     color: '#f0f6fc', r: 3   },
      { d: dates.qa_complete,  label: null,     color: '#f0f6fc', r: 3   },
      { d: dates.done,         label: null,     color: '#f0f6fc', r: 3   },
    ].filter(m => m.d);

    milestones.forEach(m => {
      const x = dateToX(m.d);
      ctx.fillStyle = m.color; ctx.strokeStyle = '#0d1117'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, rowMid, m.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (m.label) {
        ctx.font = '600 9px -apple-system, sans-serif';
        ctx.fillStyle = m.color;
        ctx.textAlign = 'center';
        ctx.fillText(m.label, x, barY - 3);
        ctx.textAlign = 'left';
      }
    });

    // 실 작업 일수 레이블 (빈 기간 + 수동 조정 반영)
    if (dates.done) {
      const activeDays = calcActiveDays(segments, task.name);
      ctx.font = '600 10px -apple-system, sans-serif';
      ctx.fillStyle = '#58a6ff';
      ctx.fillText(`${activeDays}d`, dateToX(dates.done)+6, rowMid+4);
    }

    taskMeta.push({ task, dates, segments, y, inProgress });
  });

  // 툴팁
  const tooltip = document.getElementById('tooltip');
  const phaseLabels = { planning:'기획', design:'디자인', dev:'개발', qa:'QA', release:'배포' };

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    const my = (e.clientY - r.top) * (canvas.height / r.height);
    const found = taskMeta.find(t => my >= t.y && my <= t.y + ROW_H);
    if (!found) { tooltip.style.display = 'none'; return; }

    const { task, dates, inProgress } = found;
    const segSummary = found.segments.map(s => {
      const days = Math.round((s.end - s.start) / 86400000);
      return `<div class="tt-row"><span class="tt-label">${phaseLabels[s.phase]}</span><span class="tt-val">${fmtDate(s.start)} – ${fmtDate(s.end)} (${days}일)</span></div>`;
    }).join('');

    let html = `<div class="tt-title">${task.name}</div>`;
    html += `<div class="tt-row"><span class="tt-label">담당</span><span class="tt-val">${task.owner}</span></div>`;
    html += `<div class="tt-row"><span class="tt-label">생성일</span><span class="tt-val">${fmtDate(dates.created)}</span></div>`;
    if (dates.done) {
      const adjs      = ADJUSTMENTS[task.name] || [];
      const activeDays = calcActiveDays(found.segments, task.name);
      const totalDays  = Math.round((dates.done - dates.created) / 86400000);
      html += `<div class="tt-row"><span class="tt-label">완료일</span><span class="tt-val">${fmtDate(dates.done)}</span></div>`;
      html += `<hr class="tt-divider">${segSummary}`;
      if (adjs.length) {
        const phaseLabel = { planning:'기획', design:'디자인', dev:'개발', qa:'QA', release:'배포' };
        adjs.forEach(a => {
          const sign = a.days > 0 ? `+${a.days}` : `${a.days}`;
          html += `<div class="tt-row" style="color:#f0883e"><span class="tt-label">조정 (${phaseLabel[a.phase]})</span><span class="tt-val">${sign}일 — ${a.note}</span></div>`;
        });
      }
      html += `<hr class="tt-divider">`;
      html += `<div class="tt-row"><span class="tt-label">실 작업 기간</span><span class="tt-val tt-leadtime">${activeDays}일</span></div>`;
      if (totalDays !== activeDays) {
        html += `<div class="tt-row"><span class="tt-label">전체 기간</span><span class="tt-val" style="color:#6e7681">${totalDays}일 (공백 ${totalDays - activeDays}일 포함)</span></div>`;
      }
    } else {
      html += `<hr class="tt-divider">${segSummary}<hr class="tt-divider">`;
      html += `<div class="tt-row"><span class="tt-label">상태</span><span class="tt-val tt-inprogress">진행중</span></div>`;
    }

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    let tx = e.clientX + 18, ty = e.clientY - 30;
    if (tx + 260 > window.innerWidth)  tx = e.clientX - 278;
    if (ty + tooltip.offsetHeight > window.innerHeight) ty = e.clientY - tooltip.offsetHeight - 8;
    if (ty < 8) ty = 8;
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const my = (e.clientY - r.top) * (canvas.height / r.height);
    const found = taskMeta.find(t => my >= t.y && my <= t.y + ROW_H);
    if (found?.task.link) window.open(found.task.link, '_blank');
  });
  canvas.style.cursor = 'pointer';
}

// ── 데이터 로드 ───────────────────────────────────────────────
async function loadAndRender() {
  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — data.json을 읽을 수 없습니다`);
    const json = await resp.json();
    if (!json.tasks?.length) throw new Error('태스크 데이터가 없습니다');

    const updatedEl = document.getElementById('updated-at');
    if (updatedEl && json.updated) updatedEl.textContent = `최종 동기화: ${json.updated}`;

    renderChart(json.tasks);
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    const errEl = document.getElementById('error');
    errEl.style.display = 'block';
    errEl.innerHTML = `
      <strong>데이터를 불러오지 못했습니다.</strong><br>
      ${err.message}
    `;
  }
}

document.addEventListener('DOMContentLoaded', loadAndRender);
</script>
</body>
</html>
