  { name: "추가상품 쿠폰 반영",        owner: "Ken",         created: "2026. 4. 1",  planning: "",           design_draft: "",            dev_review: "",            guide: "",            dev_complete: "2026. 4. 6",  qa_complete: "2026. 4. 7",  done: "2026. 4. 13", link: "" },

  { name: "내차 팔기 플로우",          owner: "Ken",         created: "2026. 5. 18", planning: "",           design_draft: "2026. 5. 22", dev_review: "",            guide: "",            dev_complete: "",            qa_complete: "",            done: "2026. 5. 26", link: "https://app.asana.com/0/1213968584562495/1214879592868445" },
  { name: "segment 배치 개선 (null 없도록)", owner: "Mike", created: "2026. 5. 21", planning: "",           design_draft: "",            dev_review: "",            guide: "",            dev_complete: "2026. 5. 22", qa_complete: "2026. 5. 22", done: "2026. 5. 22", link: "https://app.asana.com/0/1213968584562495/1214987200405712" },
];

function parseDate(s) {
  if (!s || !s.trim()) return null;
  const p = s.replace(/\./g, ' ').trim().split(/\s+/).filter(Boolean);
  if (p.length < 3) return null;
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function fmtDate(d) {
  if (!d) return '-';
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function getSegments(task) {
  const d = {
    created:      parseDate(task.created),
    design_draft: parseDate(task.design_draft),
    guide:        parseDate(task.guide),
    dev_complete: parseDate(task.dev_complete),
    qa_complete:  parseDate(task.qa_complete),
    done:         parseDate(task.done),
  };

  const phaseFor = {
    created:      'planning',
    design_draft: 'design',
    guide:        'dev',
    dev_complete: 'qa',
    qa_complete:  'release',
  };

  const keys = ['created', 'design_draft', 'guide', 'dev_complete', 'qa_complete', 'done'];
  const points = keys.map(k => ({ key: k, d: d[k] })).filter(x => x.d);

  // Keep only monotonically increasing dates
  const mono = [];
  for (const p of points) {
    if (!mono.length || p.d >= mono[mono.length - 1].d) mono.push(p);
  }

  const segments = [];
  for (let i = 0; i < mono.length - 1; i++) {
    const phase = phaseFor[mono[i].key];
    if (!phase) continue;
    if (mono[i + 1].d > mono[i].d) {
      segments.push({ start: mono[i].d, end: mono[i + 1].d, phase });
    }
  }
  return { segments, dates: d };
}

// ── Layout constants ──────────────────────────────────────────
const LABEL_W  = 188;
const ROW_H    = 42;
const BAR_H    = 20;
const HEADER_H = 54;
const PPD      = 7.2;      // pixels per day
const PAD_R    = 24;

const CHART_START = new Date(2026, 1, 1);   // Feb 1
const CHART_END   = new Date(2026, 5, 15);  // Jun 15
const TOTAL_DAYS  = (CHART_END - CHART_START) / 86400000;

const canvas = document.getElementById('chart');
canvas.width  = LABEL_W + Math.ceil(TOTAL_DAYS * PPD) + PAD_R;
canvas.height = HEADER_H + rawTasks.length * ROW_H + 12;
const ctx = canvas.getContext('2d');

function dateToX(d) {
  return LABEL_W + (d - CHART_START) / 86400000 * PPD;
}

function roundRect(x, y, w, h, r) {
  if (w < 1) w = 1;
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Background ────────────────────────────────────────────────
ctx.fillStyle = '#0d1117';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ── Month columns ─────────────────────────────────────────────
const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월'];
for (let m = 2; m <= 6; m++) {
  const d = new Date(2026, m - 1, 1);
  const x = dateToX(d);
  // Alternating column tint
  if (m % 2 === 0) {
    const nextX = m < 6 ? dateToX(new Date(2026, m, 1)) : canvas.width;
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    ctx.fillRect(x, HEADER_H, nextX - x, canvas.height - HEADER_H);
  }
  // Month label
  ctx.fillStyle = '#3d444d';
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.fillText(monthNames[m - 1], x + 6, 22);
  // Week marks within month
  const daysInMonth = new Date(2026, m, 0).getDate();
  for (let w = 7; w < daysInMonth; w += 7) {
    const wx = dateToX(new Date(2026, m - 1, w));
    ctx.strokeStyle = '#1c2128';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wx, HEADER_H);
    ctx.lineTo(wx, canvas.height);
    ctx.stroke();
  }
}

// ── Month separator lines ─────────────────────────────────────
for (let m = 2; m <= 6; m++) {
  const x = dateToX(new Date(2026, m - 1, 1));
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x, canvas.height);
  ctx.stroke();
}

// ── Header line ───────────────────────────────────────────────
ctx.strokeStyle = '#30363d';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(0, HEADER_H);
ctx.lineTo(canvas.width, HEADER_H);
ctx.stroke();

// ── Label area bg ─────────────────────────────────────────────
ctx.fillStyle = '#0d1117';
ctx.fillRect(0, 0, LABEL_W, canvas.height);
ctx.strokeStyle = '#21262d';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(LABEL_W, 0);
ctx.lineTo(LABEL_W, canvas.height);
ctx.stroke();

// ── "태스크" header label ─────────────────────────────────────
ctx.fillStyle = '#6e7681';
ctx.font = '700 11px -apple-system, sans-serif';
ctx.fillText('태스크', 12, 22);

// ── Draw tasks ────────────────────────────────────────────────
const taskMeta = [];

rawTasks.forEach((task, i) => {
  const { segments, dates } = getSegments(task);
  const inProgress = !dates.done;
  const y      = HEADER_H + i * ROW_H;
  const rowMid = y + ROW_H / 2;
  const barY   = rowMid - BAR_H / 2;

  // Row zebra
  ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0)' : 'rgba(255,255,255,0.015)';
  ctx.fillRect(0, y, canvas.width, ROW_H);

  // Row divider
  ctx.strokeStyle = '#161b22';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y + ROW_H);
  ctx.lineTo(canvas.width, y + ROW_H);
  ctx.stroke();

  // Task name
  ctx.font = `${inProgress ? '400' : '400'} 12px -apple-system, sans-serif`;
  ctx.fillStyle = inProgress ? '#8b949e' : '#c9d1d9';
  let name = task.name;
  while (ctx.measureText(name + '…').width > LABEL_W - 16 && name.length > 2) name = name.slice(0, -1);
  if (name !== task.name) name += '…';
  ctx.fillText(name, 12, rowMid + 4.5);

  // Owner badge
  const ownerColors = { Dacia: '#1f4e8c', Ken: '#1a4731', Mike: '#4a1942', Harry: '#5c2e00', Shunie: '#1e3a4a' };
  const ownerColor = ownerColors[task.owner.split(',')[0].trim()] || '#1c2128';
  ctx.fillStyle = ownerColor;
  roundRect(12, rowMid + 9, 5, 5, 2);
  ctx.fill();

  // Baseline bar (full duration)
  if (dates.created) {
    const endD = dates.done || CHART_END;
    const x1 = dateToX(dates.created);
    const x2 = Math.min(dateToX(endD), canvas.width - PAD_R);
    ctx.fillStyle = '#21262d';
    roundRect(x1, rowMid - 2, Math.max(x2 - x1, 4), 4, 2);
    ctx.fill();
  }

  // Phase segments
  segments.forEach(seg => {
    const x1 = dateToX(seg.start);
    const x2 = Math.min(dateToX(seg.end), canvas.width - PAD_R);
    const w = Math.max(x2 - x1, 3);
    const base = PHASES[seg.phase].color;
    ctx.fillStyle = inProgress ? base + 'aa' : base;
    roundRect(x1, barY, w, BAR_H, 4);
    ctx.fill();
    // Subtle highlight
    const grad = ctx.createLinearGradient(x1, barY, x1, barY + BAR_H);
    grad.addColorStop(0, 'rgba(255,255,255,0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0.0)');
    ctx.fillStyle = grad;
    roundRect(x1, barY, w, BAR_H, 4);
    ctx.fill();
  });

  // In-progress dashed tail
  if (inProgress && dates.created) {
    const lastD = dates.dev_complete || dates.guide || dates.design_draft || dates.created;
    const x = Math.min(dateToX(lastD), canvas.width - PAD_R - 40);
    ctx.strokeStyle = '#3fb95088';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(x, rowMid);
    ctx.lineTo(x + 48, rowMid);
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrow head
    ctx.fillStyle = '#3fb95088';
    ctx.beginPath();
    ctx.moveTo(x + 52, rowMid);
    ctx.lineTo(x + 45, rowMid - 5);
    ctx.lineTo(x + 45, rowMid + 5);
    ctx.closePath();
    ctx.fill();
  }

  // Milestone dots
  const milestones = [
    { d: dates.design_draft, label: '시안' },
    { d: dates.guide,        label: '가이드' },
    { d: dates.dev_complete, label: '개발완료' },
    { d: dates.qa_complete,  label: 'QA완료' },
    { d: dates.done,         label: '완료' },
  ].filter(m => m.d);

  milestones.forEach(m => {
    const x = dateToX(m.d);
    ctx.fillStyle = '#f0f6fc';
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, rowMid, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });

  // Lead time label
  if (dates.done && dates.created) {
    const leadDays = Math.round((dates.done - dates.created) / 86400000);
    const x2 = dateToX(dates.done);
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.fillStyle = '#58a6ff';
    ctx.fillText(`${leadDays}d`, x2 + 6, rowMid + 4);
  }

  taskMeta.push({ task, dates, segments, y, inProgress });
});

// ── Tooltip ───────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const scaleY = canvas.height / r.height;
  const my = (e.clientY - r.top) * scaleY;

  const found = taskMeta.find(t => my >= t.y && my <= t.y + ROW_H);
  if (!found) { tooltip.style.display = 'none'; return; }

  const { task, dates, inProgress } = found;
  const phaseLabels = {
    planning: '기획',
    design:   '디자인',
    dev:      '개발',
    qa:       'QA',
    release:  '배포',
  };
  const segSummary = found.segments.map(s => {
    const days = Math.round((s.end - s.start) / 86400000);
    return `<div class="tt-row"><span class="tt-label">${phaseLabels[s.phase]}</span><span class="tt-val">${fmtDate(s.start)} – ${fmtDate(s.end)} (${days}일)</span></div>`;
  }).join('');

  let html = `<div class="tt-title">${task.name}</div>`;
  html += `<div class="tt-row"><span class="tt-label">담당</span><span class="tt-val">${task.owner}</span></div>`;
  html += `<div class="tt-row"><span class="tt-label">생성일</span><span class="tt-val">${fmtDate(dates.created)}</span></div>`;
  if (dates.done) {
    const ld = Math.round((dates.done - dates.created) / 86400000);
    html += `<div class="tt-row"><span class="tt-label">완료일</span><span class="tt-val">${fmtDate(dates.done)}</span></div>`;
    html += `<hr class="tt-divider">`;
    html += segSummary;
    html += `<hr class="tt-divider">`;
    html += `<div class="tt-row"><span class="tt-label">총 리드타임</span><span class="tt-val tt-leadtime">${ld}일</span></div>`;
  } else {
    html += `<hr class="tt-divider">`;
    html += segSummary;
    html += `<hr class="tt-divider">`;
    html += `<div class="tt-row"><span class="tt-label">상태</span><span class="tt-val tt-inprogress">진행중</span></div>`;
  }

  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  let tx = e.clientX + 18, ty = e.clientY - 30;
  if (tx + 260 > window.innerWidth)  tx = e.clientX - 278;
  if (ty + tooltip.offsetHeight > window.innerHeight) ty = e.clientY - tooltip.offsetHeight - 8;
  if (ty < 8) ty = 8;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const my = (e.clientY - r.top) * (canvas.height / r.height);
  const found = taskMeta.find(t => my >= t.y && my <= t.y + ROW_H);
  if (found && found.task.link) window.open(found.task.link, '_blank');
});

canvas.style.cursor = 'pointer';
</script>
</body>
</html>
