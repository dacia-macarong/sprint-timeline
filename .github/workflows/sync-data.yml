name: Sync Google Sheets

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 자동 실행
  push:
    branches: [main]
  workflow_dispatch:           # 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV from Google Sheets
        run: |
          curl -L \
            "https://docs.google.com/spreadsheets/d/1XTE_X-NEkVE6A2FrCDmbUg9qjNsbOXO1WUGUZ16wN1k/export?format=csv&gid=0" \
            -o data.csv

      - name: Convert CSV to JSON
        run: |
          python3 << 'EOF'
          import csv, json
          from datetime import datetime, timezone, timedelta
          KST = timezone(timedelta(hours=9))

          with open('data.csv', encoding='utf-8') as f:
              rows = list(csv.reader(f))

          header_idx = next(
              (i for i, r in enumerate(rows) if r and r[0].strip() == '태스크'),
              None
          )
          if header_idx is None:
              raise ValueError('헤더 행(태스크)을 찾을 수 없습니다')

          def g(row, idx):
              return row[idx].strip() if len(row) > idx else ''

          tasks = []
          section = 0
          for row in rows[header_idx + 1:]:
              if not row or not row[0].strip():
                  section += 1   # 빈 행 = 섹션 구분
                  continue
              tasks.append({
                  'section':      section,
                  'name':         g(row, 0),
                  'owner':        g(row, 1),
                  'created':      g(row, 2),
                  'planning':     g(row, 3),
                  'design_start': g(row, 4),
                  'design_draft': g(row, 5),
                  'dev_review':   g(row, 6),
                  'guide':        g(row, 7),
                  'dev_complete': g(row, 8),
                  'qa_complete':  g(row, 9),
                  'done':         g(row, 10),
                  'link':         g(row, 11),
              })

          result = {
              'updated': datetime.now(KST).strftime('%Y-%m-%d %H:%M KST'),
              'tasks': tasks,
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'✅ {len(tasks)}개 태스크 저장 완료')
          EOF

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "chore: sync data from Google Sheets"
            git pull --rebase origin main
            git push
          fi
